name: Build Custom Firefox for TV

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to trigger the build manually with a click

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Compile Firefox APK
      run: ./gradlew fenix:assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: firefox-tv-custom-apk
        path: app/build/outputs/apk/debug/*.apk
